{% extends "base.html" %}

{% block title %}Build Resume with AI - AuraRise{% endblock %}

{% block content %}
<div class="relative min-h-screen bg-gradient-to-br from-purple-950 via-indigo-950 to-slate-950 text-white overflow-hidden py-8 px-4 sm:px-6 lg:px-12"
     x-data="aiChatBuilderApp()"
     x-init="initChat()">

    <!-- Ambient Glow Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-pink-600/20 rounded-full blur-[140px] pointer-events-none animate-pulse"></div>
    <div class="absolute top-1/2 -right-32 w-96 h-96 bg-purple-600/20 rounded-full blur-[140px] pointer-events-none animate-pulse"></div>

    <div class="max-w-7xl mx-auto space-y-6 relative z-10">

        <!-- Top Header & Usage Counter -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-white/5 border border-white/10 rounded-3xl p-4 sm:p-6 backdrop-blur-2xl shadow-2xl">
            <div class="flex items-center gap-3 sm:gap-4">
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center text-2xl sm:text-3xl shadow-lg shadow-pink-500/30 flex-shrink-0">
                    🤖
                </div>
                <div>
                    <h1 class="text-xl sm:text-3xl font-black italic tracking-tighter uppercase bg-gradient-to-r from-yellow-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">
                        Build with AI
                    </h1>
                    <p class="text-[10px] sm:text-xs font-bold text-white/50 uppercase tracking-widest italic mt-0.5">
                        Interactive Resume Assistant & PDF Generator
                    </p>
                </div>
            </div>

            <!-- Header Action Controls -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto justify-between sm:justify-end">
                <button @click="showMobileHistory = !showMobileHistory" class="lg:hidden flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 text-indigo-300 font-black uppercase italic tracking-wider text-xs transition-all shadow-lg">
                    <span>📜</span>
                    <span x-text="showMobileHistory ? 'Hide History' : 'History'"></span>
                </button>

                <button @click="startNewChat()" class="flex items-center gap-1.5 px-4 py-2.5 sm:px-5 sm:py-3 rounded-2xl bg-pink-500/20 hover:bg-pink-500/30 border border-pink-500/40 text-pink-300 font-black uppercase italic tracking-wider text-xs transition-all shadow-lg">
                    <span>✨</span>
                    <span>New Chat</span>
                </button>

                <div class="flex items-center gap-2 sm:gap-3 bg-white/5 border border-white/10 px-3.5 py-2.5 sm:px-5 sm:py-3 rounded-2xl">
                    <span class="text-lg sm:text-xl">⚡</span>
                    <div class="text-right">
                        <p class="text-[9px] sm:text-[10px] font-black uppercase tracking-widest text-pink-400">Daily Quota</p>
                        <p class="text-xs font-black text-white italic" x-text="usage.current_today + ' / ' + usage.max_limit + ' Used'"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Layout (Active Chat Area FIRST on Mobile + History Drawer/Sidebar) -->
        <div class="flex flex-col lg:grid lg:grid-cols-4 gap-6 items-start">

            <!-- Main Chat Conversation Panel (Appears FIRST on Mobile) -->
            <div class="w-full lg:col-span-3 bg-indigo-950/40 border border-white/10 rounded-[2rem] sm:rounded-[2.5rem] backdrop-blur-3xl shadow-2xl overflow-hidden flex flex-col h-[75vh] lg:h-[72vh] order-1 lg:order-2">

                
                <!-- Message List Thread -->
                <div class="flex-1 overflow-y-auto p-6 space-y-6 sidebar-scroll" id="chatThread">
                    <template x-for="(msg, index) in messages" :key="index">
                        <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                            <div :class="msg.role === 'user' 
                                        ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-3xl rounded-tr-none px-6 py-4 max-w-[85%] sm:max-w-[70%] shadow-lg' 
                                        : 'bg-white/10 border border-white/10 text-white rounded-3xl rounded-tl-none px-6 py-4 max-w-[90%] sm:max-w-[80%] backdrop-blur-xl shadow-xl'">
                                
                                <!-- Sender Tag -->
                                <div class="flex items-center gap-2 mb-2 pb-1 border-b border-white/10">
                                    <span x-text="msg.role === 'user' ? '👤 You' : '🤖 AuraRise AI'" class="text-[10px] font-black uppercase tracking-widest italic opacity-75"></span>
                                    <template x-if="msg.file">
                                        <span class="text-[9px] font-bold bg-white/20 px-2 py-0.5 rounded-full" x-text="'📎 ' + msg.file"></span>
                                    </template>
                                </div>

                                <!-- Text Content -->
                                <div class="text-sm font-medium leading-relaxed whitespace-pre-wrap" x-text="msg.content"></div>
                            </div>
                        </div>
                    </template>

                    <!-- AI Thinking Indicator -->
                    <div x-show="isLoading" class="flex justify-start" x-cloak>
                        <div class="bg-white/10 border border-white/10 text-white rounded-3xl rounded-tl-none px-6 py-4 flex items-center gap-3 backdrop-blur-xl">
                            <span class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-ping"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-purple-400 animate-ping animation-delay-200"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-ping animation-delay-400"></span>
                            <span class="text-xs font-bold italic text-white/70">AuraRise AI is thinking...</span>
                        </div>
                    </div>

                    <!-- Generated Resume Completion Card -->
                    <template x-if="completedResumeId">
                        <div class="p-6 rounded-3xl bg-gradient-to-r from-green-500/20 via-emerald-600/20 to-teal-500/20 border-2 border-green-400/40 backdrop-blur-2xl animate-fade-in text-center space-y-4 shadow-2xl">
                            <div class="text-5xl">🎉</div>
                            <h3 class="text-xl sm:text-2xl font-black uppercase italic tracking-tighter text-green-300">
                                Resume Successfully Generated!
                            </h3>
                            <p class="text-xs sm:text-sm text-white/80 font-medium max-w-lg mx-auto">
                                Your resume has been synthesized and saved directly to your account. You can now download your official PDF or customize details!
                            </p>
                            <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
                                <a :href="'/create?resume_id=' + completedResumeId" class="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-black uppercase italic tracking-widest text-xs hover:scale-105 transition-transform shadow-xl">
                                    📄 View & Edit Resume
                                </a>
                                <a :href="'/api/resume/' + completedResumeId + '/download'" target="_blank" class="px-6 py-3.5 rounded-2xl bg-green-500 hover:bg-green-400 text-white font-black uppercase italic tracking-widest text-xs hover:scale-105 transition-all shadow-xl">
                                    📥 Download PDF
                                </a>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Quick Action Suggestions Bar -->
                <div class="px-4 sm:px-6 py-3 bg-black/20 border-t border-white/5 flex overflow-x-auto whitespace-nowrap gap-2 items-center sidebar-scroll">
                    <span class="text-[10px] font-black uppercase tracking-widest text-white/40 italic mr-2 flex-shrink-0">Suggestions:</span>
                    <button @click="setInput('I want to build a Software Engineer resume from scratch.')" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/15 transition-all flex-shrink-0">
                        💻 Software Engineer
                    </button>
                    <button @click="setInput('I am a final year student specializing in IT/CS seeking internships.')" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/15 transition-all flex-shrink-0">
                        🎓 Student / Fresher
                    </button>
                    <button @click="triggerFileInput()" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-pink-500/20 border border-pink-500/40 text-pink-300 hover:bg-pink-500/30 transition-all flex-shrink-0">
                        📎 Upload Old Resume (PDF/DOCX/Image)
                    </button>
                </div>

                <!-- Attached File Preview Badge -->
                <div x-show="attachedFile" class="px-6 py-2 bg-purple-900/40 border-t border-purple-500/30 flex items-center justify-between" x-cloak>
                    <div class="flex items-center gap-2 text-xs font-bold text-pink-300">
                        <span>📎 Attached:</span>
                        <span x-text="attachedFile ? attachedFile.name : ''"></span>
                    </div>
                    <button @click="attachedFile = null; if ($refs.fileInput) $refs.fileInput.value = ''" class="text-xs text-red-400 hover:underline">Remove</button>
                </div>

                <!-- Chat Input Footer -->
                <form @submit.prevent="sendMessage()" class="p-4 bg-white/5 border-t border-white/10 flex items-center gap-3">
                    <input type="file" x-ref="fileInput" @change="handleFileSelected($event)" accept=".pdf,.docx,.doc,.png,.jpg,.jpeg" class="hidden">
                    
                    <button type="button" @click="triggerFileInput()" class="p-3 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/10 text-white transition-all" title="Attach PDF, DOCX or Image">
                        📎
                    </button>

                    <input type="text" 
                           x-model="userInput" 
                           placeholder="Type your details or instructions..." 
                           class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-5 py-3.5 text-sm text-white placeholder-white/40 focus:outline-none focus:border-pink-500 transition-all"
                           :disabled="isLoading">

                    <button type="submit" 
                            class="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-black uppercase italic tracking-widest text-xs hover:scale-105 active:scale-95 transition-all shadow-xl disabled:opacity-50"
                            :disabled="isLoading || (!userInput.trim() && !attachedFile)">
                        Send 🚀
                    </button>
                </form>
            </div>

            <!-- Chat History Sidebar (Collapsible on Mobile, Fixed Sidebar on Desktop) -->
            <div x-show="showMobileHistory || window.innerWidth >= 1024"
                 x-transition
                 class="w-full lg:col-span-1 bg-white/5 border border-white/10 rounded-[2rem] p-5 backdrop-blur-2xl shadow-2xl space-y-4 order-2 lg:order-1">
                <div class="flex items-center justify-between pb-3 border-b border-white/10">
                    <div class="flex items-center gap-2">
                        <span class="text-lg">📜</span>
                        <h3 class="text-xs font-black uppercase italic tracking-widest text-white/80">Chat History</h3>
                    </div>
                    <div class="flex items-center gap-2">
                        <button @click="loadHistory()" class="text-xs text-white/40 hover:text-white transition-colors" title="Refresh History">
                            🔄
                        </button>
                        <button @click="showMobileHistory = false" class="lg:hidden text-xs text-white/40 hover:text-white transition-colors">
                            ✕
                        </button>
                    </div>
                </div>

                <!-- History Sessions List -->
                <div class="space-y-2 max-h-[55vh] overflow-y-auto sidebar-scroll pr-1">
                    <template x-for="chat in pastChats" :key="chat.id">
                        <div @click="loadChatSession(chat.id); showMobileHistory = false"
                             :class="currentChatId === chat.id 
                                     ? 'bg-pink-500/20 border-pink-500/40 text-white' 
                                     : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10 hover:text-white'"
                             class="p-3.5 rounded-2xl border transition-all cursor-pointer group relative flex items-center justify-between gap-2">
                            
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-bold truncate" x-text="chat.title || 'Resume Chat'"></p>
                                <p class="text-[9px] text-white/40 font-mono mt-0.5" x-text="formatChatDate(chat.updated_at)"></p>
                            </div>

                            <button @click.stop="deleteChatSession(chat.id)" class="text-xs opacity-0 group-hover:opacity-100 hover:text-red-400 p-1.5 transition-all" title="Delete Chat">
                                🗑️
                            </button>
                        </div>
                    </template>

                    <template x-if="pastChats.length === 0">
                        <div class="p-6 text-center text-white/40 space-y-2">
                            <span class="text-2xl opacity-30">💬</span>
                            <p class="text-xs font-medium">No previous chats yet. Start typing to build your resume!</p>
                        </div>
                    </template>
                </div>
            </div>

        </div>

    </div>
</div>

<script>
function aiChatBuilderApp() {
    return {
        showMobileHistory: false,
        messages: [

            {
                role: 'assistant',
                content: "👋 Hello! I am your AuraRise AI Resume Architect.\n\nYou can chat with me to build a brand new ATS-optimized resume, or upload your existing resume (PDF, Word DOCX, or Image scan) using the 📎 button!"
            }
        ],
        userInput: '',
        attachedFile: null,
        isLoading: false,
        completedResumeId: null,
        currentChatId: null,
        pastChats: [],
        usage: { current_today: 0, max_limit: 3 },

        initChat() {
            this.scrollToBottom();
            this.loadHistory();
        },

        async loadHistory() {
            try {
                const res = await fetch('/api/resume/ai-chats');
                if (res.ok) {
                    this.pastChats = await res.json();
                }
            } catch (e) {
                console.error('Error loading chat history:', e);
            }
        },

        startNewChat() {
            this.currentChatId = null;
            this.completedResumeId = null;
            this.messages = [
                {
                    role: 'assistant',
                    content: "👋 Ready for a fresh start! What role or details would you like to build your new resume for?"
                }
            ];
            this.scrollToBottom();
        },

        async loadChatSession(chatId) {
            this.isLoading = true;
            try {
                const res = await fetch(`/api/resume/ai-chats/${chatId}`);
                if (res.ok) {
                    const data = await res.json();
                    this.currentChatId = data.id;
                    this.messages = data.messages || [];
                    this.completedResumeId = null;
                    this.scrollToBottom();
                }
            } catch (e) {
                console.error('Error loading chat:', e);
            } finally {
                this.isLoading = false;
            }
        },

        async deleteChatSession(chatId) {
            if (!confirm('Are you sure you want to delete this chat session?')) return;
            try {
                const res = await fetch(`/api/resume/ai-chats/${chatId}`, { method: 'DELETE' });
                if (res.ok) {
                    if (this.currentChatId === chatId) {
                        this.startNewChat();
                    }
                    await this.loadHistory();
                }
            } catch (e) {
                console.error('Error deleting chat:', e);
            }
        },

        formatChatDate(isoString) {
            if (!isoString) return '';
            try {
                const d = new Date(isoString);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (e) { return ''; }
        },

        triggerFileInput() {
            if (this.$refs && this.$refs.fileInput) {
                this.$refs.fileInput.click();
            }
        },

        handleFileSelected(event) {
            const files = event.target.files;
            if (files && files.length > 0) {
                this.attachedFile = files[0];
            }
        },

        setInput(text) {
            this.userInput = text;
        },

        scrollToBottom() {
            this.$nextTick(() => {
                const el = document.getElementById('chatThread');
                if (el) el.scrollTop = el.scrollHeight;
            });
        },

        async sendMessage() {
            if (this.isLoading) return;
            const text = this.userInput.trim();
            const file = this.attachedFile;

            if (!text && !file) return;

            // Add user message to UI
            this.messages.push({
                role: 'user',
                content: text || (file ? `[Uploaded file: ${file.name}]` : ''),
                file: file ? file.name : null
            });

            this.userInput = '';
            this.attachedFile = null;
            if (this.$refs && this.$refs.fileInput) {
                this.$refs.fileInput.value = '';
            }
            this.isLoading = true;
            this.scrollToBottom();

            try {
                const formData = new FormData();
                formData.append('message', text);
                formData.append('chat_history', JSON.stringify(this.messages));
                if (this.currentChatId) {
                    formData.append('chat_id', this.currentChatId);
                }
                if (file) {
                    formData.append('file', file);
                }

                const res = await fetch('/api/resume/ai-chat-builder', {
                    method: 'POST',
                    body: formData
                });

                if (res.status === 429) {
                    const errData = await res.json();
                    this.messages.push({
                        role: 'assistant',
                        content: `⚠️ ${errData.detail || 'Daily AI limit reached.'}`
                    });
                    return;
                }

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const data = await res.json();
                
                if (data.usage) {
                    this.usage = data.usage;
                }

                if (data.chat_id) {
                    this.currentChatId = data.chat_id;
                    this.loadHistory();
                }

                if (data.response) {
                    this.messages.push({
                        role: 'assistant',
                        content: data.response
                    });
                }

                if (data.is_complete && data.resume_id) {
                    this.completedResumeId = data.resume_id;
                }

            } catch (err) {
                console.error('Chat error:', err);
                this.messages.push({
                    role: 'assistant',
                    content: '🚨 Sorry, an error occurred while processing your request. Please try again.'
                });
            } finally {
                this.isLoading = false;
                this.scrollToBottom();
            }
        }
    }
}
</script>
{% endblock %}
